run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - exhaustive
    - bodyclose
    - contextcheck
    - noctx
    - prealloc
    - unconvert
    - unparam
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/yourorg/habit-tracker
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    # Test files: relax some rules.
    - path: "_test\\.go"
      linters:
        - errcheck
        - unparam
