version: v2
inputs:
  - directory: proto

plugins:
  # Standard Go protobuf message types
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: gen
    opt:
      - paths=source_relative

  # Connect-Go: generates the habitv1connect package with handler interfaces
  # and client stubs — replaces grpc-go for the service layer
  - remote: buf.build/connectrpc/go:v1.16.2
    out: gen
    opt:
      - paths=source_relative
